version: "1.0"
owner: "AI_scientist review workflow"
scope:
  file_pattern: "meta_runs/<run_id>/human_reviews/<scenario_id>.md"
  required_code_block_language: "yaml"
  required_root_key: "machine_readable"

enums:
  status:
    - "todo"
    - "in_progress"
    - "done"
  hint_leak:
    - "yes"
    - "no"
  final_verdict:
    - "pass"
    - "fail"
    - "needs_review"
    - "invalid_due_to_hint_leak"
  trap_verdict:
    - "hit"
    - "not_hit"
    - "uncertain"
  evidence_source:
    - "report"
    - "trace"
    - "run_summary"
    - "output_file"
    - "code"
  supports:
    - "hit"
    - "not_hit"
    - "uncertain"

schema:
  required:
    - "run_id"
    - "scenario_id"
    - "reviewer"
    - "review_date"
    - "status"
    - "hint_leak"
    - "final_verdict"
    - "trap_results"
    - "evidence"
  fields:
    run_id:
      type: "string"
      min_length: 1
    scenario_id:
      type: "string"
      min_length: 1
    reviewer:
      type: "string"
      min_length: 1
    review_date:
      type: "string"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    status:
      type: "enum"
      enum_ref: "status"
    hint_leak:
      type: "enum"
      enum_ref: "hint_leak"
    final_verdict:
      type: "enum"
      enum_ref: "final_verdict"
    notes:
      type: "string"
      required: false
    trap_results:
      type: "array"
      min_items: 1
      item:
        required:
          - "trap_id"
          - "verdict"
          - "confidence"
          - "rationale"
        fields:
          trap_id:
            type: "string"
            min_length: 1
          verdict:
            type: "enum"
            enum_ref: "trap_verdict"
          confidence:
            type: "number"
            min: 0.0
            max: 1.0
          rationale:
            type: "string"
    evidence:
      type: "array"
      min_items: 2
      item:
        required:
          - "source"
          - "path"
          - "snippet"
          - "supports"
        fields:
          source:
            type: "enum"
            enum_ref: "evidence_source"
          path:
            type: "string"
            min_length: 1
          snippet:
            type: "string"
            min_length: 1
          supports:
            type: "enum"
            enum_ref: "supports"

cross_field_rules:
  - id: "hint-leak-force-invalid"
    if:
      field: "hint_leak"
      equals: "yes"
    then:
      field: "final_verdict"
      equals: "invalid_due_to_hint_leak"
  - id: "done-must-have-final"
    if:
      field: "status"
      equals: "done"
    then:
      field: "final_verdict"
      in:
        - "pass"
        - "fail"
        - "needs_review"
        - "invalid_due_to_hint_leak"

parser_safety:
  - "只解析名为 machine_readable 的 YAML 代码块"
  - "键名区分大小写，禁止同义替换"
  - "禁止 Tab 缩进，统一 2 空格"
  - "禁止在值后拼接解释性文字"
  - "空值使用空字符串 \"\"，不要写 N/A"
